[project]
name = "llm-autotest-common"
version = "0.1.0"
description = "LLM-AutoTest 共享核心：产物管理、节点状态机、LLM 客户端、Prompt 加载、错误码、安全"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
# 中文注释与 docstring 约定（docs/09 第二章）：保留全角标点
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
