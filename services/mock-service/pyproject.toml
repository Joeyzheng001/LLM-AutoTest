[project]
name = "llm-autotest-mock-service"
version = "0.1.0"
description = "LLM-AutoTest deterministic HTTP/JSON downstream mock service"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]


[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
