# 前端同源反代（docs/09 容器规范）：/api → orchestrator；
# client_max_body_size 与 API 层 64MB 请求体限额对齐（C-12）
server {
    listen 80;

    client_max_body_size 64m;
    # Docker 内置 DNS；编排服务横向扩展后按请求重新解析服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orchestrator_upstream http://orchestrator:8000;

    location /api/ {
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        # 不配置 proxy_next_upstream：POST 提交/重跑不能由代理自动重试，避免重复入队。
    }

    # 统一入口也暴露编排服务的只读探活端点；否则请求会落到 SPA 的 index.html，
    # 监控/运维从部门 DNS 访问时无法区分“前端可达”和“编排服务已就绪”。
    location ~ ^/(health|ready|metrics)$ {
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（发版印刷新）；assets 带 hash 可长缓存
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
