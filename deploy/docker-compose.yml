# 编排唯一事实来源（docs/09 第十一章）
# 使用：docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# 构建相对路径以本文件所在目录（deploy/）为基准：
# orchestrator/frontend 上下文 = 仓库根（Dockerfile 内 COPY prompts/schemas/nginx.conf）
services:
  java-parser:
    build: ../services/java-parser
    image: llm-autotest/java-parser:0.1.0
    ports:
      - "8081:8080"
    environment:
      # 2C/888MB 小规格机器：JVM 堆上限显式约束（JVM 原生识别该变量）
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m"
    volumes:
      - artifacts:/data/llm-autotest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    image: llm-autotest/orchestrator:0.1.0
    ports:
      - "8000:8000"
    environment:
      JAVA_PARSER_URL: http://java-parser:8080
    env_file:
      - .env
    volumes:
      - artifacts:/data/llm-autotest
      # 被测仓库宿主机目录（代码扫描/接口还原直读本地路径；只读）
      - /opt/repos:/opt/repos:ro
    depends_on:
      java-parser:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: services/frontend/Dockerfile
    image: llm-autotest/frontend:0.1.0
    ports:
      - "8080:80"
    depends_on:
      - orchestrator
    restart: unless-stopped

  # 以下服务按 profile 暂缓启用：test-executor 待 M0 契约定稿（schemas/contracts/）；
  # mock-services 待 F-EXEC-06 落地（多协议 Mock 环境）
  test-executor:
    profiles: ["exec"]
    build: ../services/test-executor
    image: llm-autotest/test-executor:0.1.0
    volumes:
      - artifacts:/data/llm-autotest

  mock-services:
    profiles: ["mock"]
    image: busybox:1.36
    command: sleep infinity

volumes:
  # 产物卷：容器内挂载点统一 /data/llm-autotest（docs/09 第十一章）；
  # 宿主机路径与备份策略待 B 定稿（docs/08 待定项 #3）
  artifacts:
    driver: local
